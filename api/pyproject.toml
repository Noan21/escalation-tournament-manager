[project]
name = "escalation-api"
version = "0.1.0"
description = "FastAPI backend for the Escalation tournament platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    "pydantic-settings>=2.3.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.1"
]

[project.optional-dependencies]
dev = [
    "black>=24.4.2",
    "ruff>=0.4.9",
    "mypy>=1.10.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "httpx>=0.27.0"
]

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM"
]
ignore = ["B008"]

[tool.ruff.format]
preview = true

[tool.mypy]
python_version = "3.11"
strict = true
plugins = []
warn_unused_configs = true
mypy_path = "app"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra"
testpaths = ["tests"]
asyncio_mode = "auto"
